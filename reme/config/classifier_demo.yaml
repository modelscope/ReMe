# Optional Jev demo. Install reme-ai[core,classifier-jev] and set CLASSIFIER_API_KEY.
# Start the service: reme start config=classifier_demo
# Call it from another terminal: reme jev state="I was charged twice."
extends: default

jobs:
  jev:
    backend: base
    enable_serve: true
    description: "Classify customer requests with Jev; returns typed answers, probabilities, and usage."
    parameters:
      type: object
      properties:
        state:
          type: [string, object]
          minLength: 1
          description: "Text or JSON object to classify"
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
          description: "Named binary, choice, or score questions; omission uses three customer-support demo questions"
      required: [state]
    steps:
      - backend: classifier_demo_step
        as_classifier: default

components:
  as_classifier:
    default:
      backend: ${CLASSIFIER_BACKEND:-jev}
      model: ${CLASSIFIER_MODEL_NAME:-jev-latest}
      credential:
        api_key: ${CLASSIFIER_API_KEY:-}
        base_url: ${CLASSIFIER_BASE_URL:-null}
      timeout: 30
      max_retries: 2
      retry_delay: 0.5
