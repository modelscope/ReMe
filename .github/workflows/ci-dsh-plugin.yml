name: CI / DSH plugin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-dsh-plugin.yml"
      - ".github/workflows/_release-npm-plugin.yml"
      - ".github/workflows/release-dsh-plugin.yml"
      - "integrations/dsh/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-dsh-plugin.yml"
      - ".github/workflows/_release-npm-plugin.yml"
      - ".github/workflows/release-dsh-plugin.yml"
      - "integrations/dsh/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Validate DSH plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/dsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: integrations/dsh/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
